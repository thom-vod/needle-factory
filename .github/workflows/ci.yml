name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev graphviz

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake graphviz
          # libcurl ships with macOS

      - name: Install dependencies (Windows / MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-graphviz

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DNEEDLE_BUILD_SERVER=ON -DNEEDLE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build -j

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/needle_tests

      - name: Configure, build, test (Windows / MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DNEEDLE_BUILD_SERVER=ON -DNEEDLE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/needle_tests.exe
