name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE', '.gitleaks.toml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE', '.gitleaks.toml']

# Cancel in-flight runs when a new commit is pushed to the same ref. Rapid
# dev pushes no longer stack up against the quota.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on every push. Linux is cheap (1× multiplier) and catches
  # the vast majority of regressions.
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev graphviz
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'third_party/**') }}
          restore-keys: ${{ runner.os }}-cmake-
      - name: Configure
        run: cmake -S . -B build -DNEEDLE_BUILD_SERVER=ON -DNEEDLE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ./build/needle_tests

  # macOS (10× multiplier) and Windows (2×) only on PRs targeting main or
  # direct pushes to main. Skipped on dev pushes to preserve quota.
  build-test-cross-platform:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    # Windows is non-blocking until the platform-specific test fixtures
    # are reworked — many tests use POSIX shell-outs (`std::system("rm -rf …")`,
    # `git init`) that flake under MSYS2/MinGW. Tracked as a follow-up.
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake graphviz

      - name: Install dependencies (Windows / MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-graphviz

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'third_party/**') }}
          restore-keys: ${{ runner.os }}-cmake-

      - name: Configure, build, test (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DNEEDLE_BUILD_SERVER=ON -DNEEDLE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/needle_tests

      - name: Configure, build, test (Windows / MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DNEEDLE_BUILD_SERVER=ON -DNEEDLE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/needle_tests.exe
