name: secret-scan

# PR-to-main is the meaningful gate — scanning AFTER a leak hits main
# can't prevent it. Direct admin pushes to main intentionally bypass
# this (per CLAUDE.md, those are for trivial doc fixes); restore the
# push trigger if that ever proves untrustworthy.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we scan every commit, not just HEAD

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan repository
        run: gitleaks detect --source . --verbose --redact --no-banner --config .gitleaks.toml
